name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify release metadata
        run: node scripts/verify-release.mjs
      - name: Attest release assets
        # Artifact attestations are unavailable for user-owned private repositories.
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; uploading assets."
            gh release upload "$RELEASE_TAG" main.js styles.css manifest.json --clobber
          else
            gh release create "$RELEASE_TAG" main.js styles.css manifest.json --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
